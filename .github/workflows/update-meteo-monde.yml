name: Mise à jour Météo Monde (CEP/ECMWF mondial)

on:
  workflow_dispatch:
  schedule:
    # Midi en France toute l'année (11 h UTC ~ 12 h/13 h locale).
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: update-meteo-monde
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Produire les prévisions CEP mondiales
        run: |
          python scripts/update_meteo_monde_cep.py \
            --config-dir config/countries \
            --output-dir build/data \
            --forecast-hours 360

      - name: Vérifier la publication
        run: |
          test -f build/data/index.json
          python -c "import json; d=json.load(open('build/data/index.json')); assert d['countries']; assert d['source']=='cep-ecmwf-ifs-0p25'"

      - name: Publier la branche data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -a build/data/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          cd "$publish_dir"
          git init -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Données Météo Monde CEP $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git"
          git push --force origin data
