name: Mise à jour Météo Monde (CEP/ECMWF mondial)

on:
  workflow_dispatch:
  schedule:
    # Midi en France toute l'année (11 h UTC ~ 12 h/13 h locale).
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: update-meteo-monde
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Produire les prévisions CEP mondiales
        run: |
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          for attempt in 1 2 3; do
            if python scripts/update_meteo_monde_cep.py \
              --config-dir config/countries \
              --output-dir build/data \
              --forecast-hours 360 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|Server is busy|ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed|socket hang up|timed out|Read timed' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done

      - name: Vérifier la publication
        run: |
          test -f build/data/index.json
          python -c "import json; d=json.load(open('build/data/index.json')); assert d['countries']; assert d['source']=='cep-ecmwf-ifs-0p25'"

      - name: Publier la branche data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -a build/data/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          cd "$publish_dir"
          git init -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Données Météo Monde CEP $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git"
          git push --force origin data
